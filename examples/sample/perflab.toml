[build]
# perflab passes the run's arguments as @<file> to perflab's JMH driver, the jar's main class
jmh = "java -jar target/benchmarks.jar {args}"
server = "self"

[benchmark]
default = "WordCountBenchmark"
corpus = "size"
jvmArgs = "-Xms1G -Xmx1G"

[paths]
runs = "out/runs"
campaigns = "out/campaigns"

[agent]
jar = "../../perflab-agent/target/perflab-agent-0.1.0-SNAPSHOT.jar"

[async]
# built by `mise run tools:async-profiler` (kperf events, jfrconv --hw); without it, an installed async-profiler
lib = "../../tools/build/async-profiler/build/lib/libasyncProfiler.dylib"
jfrconv = "../../tools/build/async-profiler/build/bin/jfrconv"
# flame graphs per event: by call path, by leaf, and every thread by category (perflab regraph lists the kinds)
graphs = ["bench", "reverse", "classify"]
