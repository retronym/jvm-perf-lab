# perflab runs this lab's benchmark (README.md)
[build]
jmh = "sbt --client 'lab/Jmh/run {args}'"
server = "sbt"

[benchmark]
default = "SbtCompileBenchmark"
# the workload: `stock` or `typednil` (README.md)
corpus = "workload"
jvmArgs = "-Xms8G -Xmx8G -Xss4M -XX:ReservedCodeCacheSize=512m"

[paths]
runs = "out/runs"
campaigns = "out/ab"

[index]
flags = "^-D|^-XX"

[agent]
jar = "~/.m2/repository/io/github/retronym/perflab/perflab-agent/0.1.0-SNAPSHOT/perflab-agent-0.1.0-SNAPSHOT.jar"

[async]
graphs = ["bench", "reverse", "threads", "classify"]
# scalac's recursion exceeds async-profiler's default of 2048 frames
stackdepth = 8192
