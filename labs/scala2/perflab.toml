# perflab runs this lab's benchmarks (README.md)
[build]
# perflab passes its JMH arguments as @<file> to perflab's JMH driver, the lab's main class
jmh = "sbt --client 'lab/Jmh/run {args}'"
server = "sbt"
# launch mode (`mode = "launch"`, or PERFLAB_BUILD_MODE=launch): a batch sbt builds once per run or campaign, perflab
# snapshots the build and starts JMH itself; SCALA_CHECKOUT (and COMPILER_BENCHMARK, SCALA_RELEASE_OPT) come from
# perflab's environment
launch = "sbt -batch 'lab/perflabLaunch {out}'"

[benchmark]
default = "CompileBenchmark"
corpus = "corpus"
variants = "variants"
# a fixed young generation, 3/8 of the heap, and no adaptive IHOP: G1 sizes the young generation from measured pause times,
# so GC points move from fork to fork; fixed, they fall at the same allocation points (doc/variance.md)
jvmArgs = "-Xms4G -Xmx4G -Xss2M -Xmn1536m -XX:-G1UseAdaptiveIHOP"

[paths]
runs = "out/runs"
campaigns = "out/ab"

[index]
flags = "^-D|^-XX"

[agent]
# `mise run install` at the root of jvm-perf-lab
jar = "~/.m2/repository/io/github/retronym/perflab/perflab-agent/0.1.0-SNAPSHOT/perflab-agent-0.1.0-SNAPSHOT.jar"

[async]
# $ASYNC_PROFILER_LIB, else the usual install locations; retronym/async-profiler's integration branch
# (`mise run tools:async-profiler` in jvm-perf-lab) adds kperf events and jfrconv --spans
graphs = ["bench", "reverse", "classify"]
# async-profiler truncates stacks at 2048 frames by default, which the typer's recursion exceeds
stackdepth = 8192
# the span panel's groupings for the compiler's cost frames (SpanCostListener)
span_config = "span-config.json"
