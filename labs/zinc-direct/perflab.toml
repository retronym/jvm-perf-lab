# perflab runs this lab's benchmark (README.md)
[build]
jmh = "sbt --client 'lab/Jmh/run {args}'"
server = "sbt"

[benchmark]
default = "ZincDirectBenchmark"
# the project under test, a directory of out/inputs
corpus = "project"
jvmArgs = "-Xms16G -Xmx16G -Xss4M -XX:ReservedCodeCacheSize=512m"

[paths]
runs = "out/runs"
campaigns = "out/ab"

[index]
flags = "^-D|^-XX"

[agent]
jar = "~/.m2/repository/io/github/retronym/perflab/perflab-agent/0.1.0-SNAPSHOT/perflab-agent-0.1.0-SNAPSHOT.jar"

[async]
# the whole JVM: the work is on the copies' own threads (zinc-copy-N), not JMH's worker; zoom into a thread in the viewer
graphs = ["jvm", "jvm-reverse", "classify"]
# the benchmark's threads, for profdiff and the per-benchmark-thread counters
threads = ".*(jmh-worker|zinc-copy).*"
# scalac's recursion exceeds async-profiler's default of 2048 frames
stackdepth = 8192
