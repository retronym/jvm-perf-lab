<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fork timeline</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --fg:#1d232b; --muted:#5d6875; --line:#dde2e8; }
@media (prefers-color-scheme: dark) { :root { --bg:#14181d; --panel:#1b2027; --fg:#e3e8ee; --muted:#94a0ad; --line:#2c333c; color-scheme:dark; } }
body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 -apple-system,system-ui,sans-serif; }
main { padding:16px; } h1 { font-size:16px; margin:0 0 4px; overflow-wrap:anywhere; } .k { color:var(--muted); font-size:12px; }

:root { --v0:#2f6fb2; --v1:#c2571a; --v2:#2e8a57; --v3:#8a4fbf; --v4:#b8860b; --v5:#3a9aa6; --pause:#d33; --grey:#c3c9d1; }
@media (prefers-color-scheme: dark) { :root { --v0:#6ea8e6; --v1:#e58a4e; --v2:#5cc08a; --v3:#b58ae6; --v4:#e0b84a; --v5:#6cc6d1;
  --pause:#ff6b6b; --grey:#46505c; } }
svg.timeline { background:var(--panel); border:1px solid var(--line); border-radius:8px; width:100%; touch-action:none; cursor:grab; display:block; }
svg.timeline text { fill:var(--fg); font-size:11px; } svg.timeline .lab { fill:var(--muted); } svg.timeline .grid { stroke:var(--line); }
.tl-legend span { display:inline-block; margin-right:12px; font-size:12px; }
.tl-legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
.tl-tip { position:fixed; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:6px;
  padding:4px 8px; font-size:12px; display:none; max-width:360px; z-index:5; }

</style>
<main><h1>out/campaigns/maps/10000/paired/2</h1>
<p class="k">Wheel or pinch to zoom, drag to pan, double-click to reset. Counter lanes cover the measurement iterations
only (xctrace records those); cycles are per second, so one busy performance core is about 4–4.5 G.</p>
<div class="tl-legend" id="legend"></div><svg class="timeline" id="chart"></svg></main><div class="tl-tip" id="tip"></div>
<script>// A benchmark fork's timeline: its iterations (coloured by variant when variants alternate within the fork) and, on the
// same wall-clock axis, what the machine did meanwhile. Reads a cell's files as written by the fork and `perflab ab`:
//   iterations.tsv  every iteration as it finishes: index, kind, variant, start_ms, end_ms, score, ops, gc_ms
//   timeline.tsv    per 50 ms: cycles and instructions of the benchmark thread, JIT, GC, other threads of the fork and
//                   other processes (from xctrace, so only once the fork has finished)
//   gc.log          -Xlog:gc with wall-clock `time` decorations (the campaign's "gcLog"): pauses
//   load.tsv        the load gate's 5 s samples of other processes' CPU, in cores
// Used by timeline.py (a page per cell) and index.py (a live panel in index.html).
const BenchTimeline = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const BIN_MS = 50;

  function tsv(text) {
    if (!text) return [];
    const lines = text.split('\n').filter(l => l.trim());
    if (!lines.length) return [];
    const head = lines[0].split('\t');
    return lines.slice(1).map(l => Object.fromEntries(l.split('\t').map((v, i) => [head[i], v])));
  }

  function parse(f) {
    const iters = tsv(f.iterations).map(r => ({i: +r.index, kind: r.kind, variant: r.variant, s: +r.start_ms, e: +r.end_ms,
      score: +r.score, gc: r.gc_ms === '' || r.gc_ms == null ? null : +r.gc_ms}));
    const series = tsv(f.timeline).map(b => ({t: +b.bin_ms, bench_c: +b.bench_cycles, bench_i: +b.bench_inst, jit_c: +b.jit_cycles,
      gc_c: +b.gc_cycles, other_c: +b.other_cycles, processes_c: +b.processes_cycles}));
    const pauses = [];
    for (const line of (f.gc || '').split('\n')) {
      const m = line.match(/^\[([^\]]+)\]\[[^\]]+\].*?(Pause[^(]*(?:\([^)]*\))*).*?([\d.]+)ms\s*$/);
      if (!m) continue;
      const end = Date.parse(m[1].replace(/([+-]\d\d)(\d\d)$/, '$1:$2'));
      if (!isNaN(end)) pauses.push({s: end - +m[3], e: end, what: m[2].trim()});
    }
    const load = (f.load || '').split('\n').map(l => l.split('\t')).filter(p => p.length >= 2 && p[0])
      .map(p => ({t: +p[0] * 1000, cores: +p[1], top: p[2] || ''}));
    return {iters, series, pauses, load};
  }

  async function fetchCell(base) {
    const get = async n => { try { const r = await fetch(base + n, {cache: 'no-store'}); return r.ok ? await r.text() : ''; } catch (e) { return ''; } };
    const [iterations, timeline, gc, load] = await Promise.all(['iterations.tsv', 'timeline.tsv', 'gc.log', 'load.tsv'].map(get));
    return parse({iterations, timeline, gc, load});
  }

  function mount(svg, legend, tip) {
    let D = {iters: [], series: [], pauses: [], load: []}, t0 = 0, t1 = 1, x0 = 0, x1 = 1, zoomed = false;
    const L = 150, R = 16;
    const rows = [
      {name: 'iterations', h: 46},
      {name: 'benchmark thread', h: 80, key: 'bench_c', unit: 'G cycles/s'},
      {name: 'IPC (benchmark)', h: 56, ipc: true},
      {name: 'GC threads', h: 70, key: 'gc_c', unit: 'G cycles/s', pauses: true},
      {name: 'JIT threads', h: 56, key: 'jit_c', unit: 'G cycles/s'},
      {name: 'other in fork', h: 46, key: 'other_c', unit: 'G cycles/s'},
      {name: 'other processes', h: 86, key: 'processes_c', unit: 'G cycles/s', load: true},
    ];
    const height = rows.reduce((a, r) => a + r.h + 8, 8) + 24;
    svg.setAttribute('height', height);
    let variants = [];
    const color = v => v ? `var(--v${variants.indexOf(v) % 6})` : 'var(--v0)';
    function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; }

    function draw() {
      svg.innerHTML = '';
      const W = svg.clientWidth || 900, X = t => L + (t - x0) / (x1 - x0) * (W - L - R);
      if (!D.iters.length && !D.series.length) {
        svg.setAttribute('height', 40);
        el('text', {x: 12, y: 24, class: 'lab'}).textContent = 'No iterations yet.';
        return;
      }
      svg.setAttribute('height', height);
      let y = 8;
      const span = x1 - x0, step = [100, 200, 500, 1000, 2000, 5000, 10000, 20000, 60000].find(s => span / s < 12) || 120000;
      for (let t = Math.ceil((x0 - t0) / step) * step; t0 + t <= x1; t += step) {
        el('line', {x1: X(t0 + t), x2: X(t0 + t), y1: 0, y2: height - 22, class: 'grid'});
        el('text', {x: X(t0 + t) + 2, y: height - 8, class: 'lab'}).textContent = (t / 1000).toFixed(step < 1000 ? 1 : 0) + ' s';
      }
      for (const r of rows) {
        el('text', {x: 6, y: y + 14}).textContent = r.name;
        if (r.unit) el('text', {x: 6, y: y + 28, class: 'lab'}).textContent = r.unit;
        el('line', {x1: L, x2: W - R, y1: y + r.h, y2: y + r.h, class: 'grid'});
        if (r.name === 'iterations') {
          for (const it of D.iters) {
            if (it.e < x0 || it.s > x1) continue;
            const a = Math.max(X(it.s), L), b = Math.min(X(it.e), W - R);
            const rect = el('rect', {x: a, y: y + 6, width: Math.max(1, b - a - 1), height: r.h - 12, rx: 2,
              fill: it.kind === 'warmup' ? 'var(--grey)' : color(it.variant)});
            rect.dataset.tip = `#${it.i} ${it.kind} ${it.variant || ''}: ${it.score.toFixed(1)} ms/op` + (it.gc != null ? `, GC pauses ${it.gc} ms` : '');
            if (b - a > 46) el('text', {x: a + 4, y: y + r.h / 2 + 4}).textContent = it.score.toFixed(1);
          }
        } else if (!D.series.length) {
          if (r.name === 'benchmark thread') el('text', {x: L + 6, y: y + 20, class: 'lab'}).textContent = 'counters appear when the fork has finished (xctrace export)';
        } else {
          const pts = r.ipc ? D.series.map(s => ({t: s.t, v: s.bench_c ? s.bench_i / s.bench_c : null}))
                            : D.series.map(s => ({t: s.t, v: s[r.key] / (BIN_MS / 1000) / 1e9}));
          const vis = pts.filter(p => p.t >= x0 - BIN_MS && p.t <= x1 && p.v != null);
          const max = r.ipc ? Math.max(4, ...vis.map(p => p.v)) : Math.max(0.5, ...vis.map(p => p.v));
          const Y = v => y + r.h - 4 - v / max * (r.h - 10);
          el('text', {x: L - 4, y: y + 12, 'text-anchor': 'end', class: 'lab'}).textContent = max.toFixed(1);
          let d = '';
          for (const p of vis) d += (d ? 'L' : 'M') + X(p.t + BIN_MS / 2).toFixed(1) + ',' + Y(p.v).toFixed(1);
          if (d) el('path', {d, fill: 'none', stroke: r.ipc ? 'var(--v2)' : 'var(--v0)', 'stroke-width': 1.2});
        }
        if (r.pauses) for (const p of D.pauses) {
          if (p.e < x0 || p.s > x1) continue;
          const m = el('rect', {x: X(p.s), y: y + 2, width: Math.max(2, X(p.e) - X(p.s)), height: r.h - 4, fill: 'var(--pause)', opacity: 0.55});
          m.dataset.tip = `${p.what}: ${(p.e - p.s).toFixed(1)} ms`;
        }
        if (r.load && D.load.length) {
          const lmax = Math.max(2, ...D.load.map(l => l.cores));
          el('text', {x: W - R - 2, y: y + 12, 'text-anchor': 'end', class: 'lab'}).textContent = `load.tsv: other processes, cores (max ${lmax.toFixed(1)})`;
          let ld = '';
          for (const l of D.load) {
            if (l.t < x0 - 5000 || l.t > x1 + 5000) continue;
            const yy = y + r.h - 4 - l.cores / lmax * (r.h - 10);
            const clamp = x => Math.min(Math.max(x, L), W - R);
            ld += (ld ? 'L' : 'M') + clamp(X(l.t - 5000)).toFixed(1) + ',' + yy.toFixed(1) + 'L' + clamp(X(l.t)).toFixed(1) + ',' + yy.toFixed(1);
          }
          if (ld) el('path', {d: ld, fill: 'none', stroke: 'var(--v1)', 'stroke-width': 1.2, 'stroke-dasharray': '4 3'});
        }
        y += r.h + 8;
      }
    }

    function set(data) {
      D = data;
      variants = [...new Set(D.iters.map(i => i.variant).filter(v => v))];
      const ts = [...D.iters.flatMap(i => [i.s, i.e]), ...D.series.map(s => s.t), ...D.series.map(s => s.t + BIN_MS)];
      const n0 = ts.length ? Math.min(...ts) : 0, n1 = ts.length ? Math.max(...ts) : 1;
      // keep a zoomed view where it is as data arrives; otherwise follow the whole range
      if (!zoomed) { x0 = n0; x1 = Math.max(n1, n0 + 1); }
      t0 = n0; t1 = Math.max(n1, n0 + 1);
      if (legend) legend.innerHTML = variants.map(v => `<span><i style="background:${color(v)}"></i>${v}</span>`).join('')
        + '<span><i style="background:var(--grey)"></i>warmup</span>' + (D.pauses.length ? '<span><i style="background:var(--pause)"></i>GC pause</span>' : '');
      draw();
    }

    svg.addEventListener('wheel', e => { e.preventDefault(); const W = svg.clientWidth, f = Math.exp(e.deltaY * 0.002);
      const at = x0 + (e.offsetX - L) / (W - L - R) * (x1 - x0); x0 = Math.max(t0, at - (at - x0) * f); x1 = Math.min(t1, at + (x1 - at) * f); zoomed = true; draw(); }, {passive: false});
    let drag = null;
    svg.addEventListener('pointerdown', e => { drag = {x: e.clientX, x0, x1}; svg.setPointerCapture(e.pointerId); });
    svg.addEventListener('pointermove', e => {
      const t = e.target.dataset && e.target.dataset.tip;
      if (tip && t && !drag) { tip.textContent = t; tip.style.display = 'block'; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; }
      else if (tip && !drag) tip.style.display = 'none';
      if (!drag) return;
      const W = svg.clientWidth, dt = (e.clientX - drag.x) / (W - L - R) * (drag.x1 - drag.x0), w = drag.x1 - drag.x0;
      x0 = Math.min(Math.max(t0, drag.x0 - dt), t1 - w); x1 = x0 + w; zoomed = true; draw();
    });
    svg.addEventListener('pointerup', () => drag = null);
    svg.addEventListener('dblclick', () => { zoomed = false; x0 = t0; x1 = t1; draw(); });
    window.addEventListener('resize', draw);
    return {set, reset() { zoomed = false; }};
  }

  return {parse, fetchCell, mount};
})();

BenchTimeline.mount(document.getElementById('chart'), document.getElementById('legend'), document.getElementById('tip'))
  .set(BenchTimeline.parse({"iterations": "index\tkind\tvariant\tstart_ms\tend_ms\tscore\tops\tgc_ms\n0\twarmup\thash\t1792034521104\t1792034522131\t180.8129\t5560\t5\n1\twarmup\tlinked\t1792034522138\t1792034523144\t199.7889\t5031\t4\n2\twarmup\ttree\t1792034523145\t1792034524151\t406.6020\t2472\t3\n3\twarmup\tlinked\t1792034524151\t1792034525158\t203.2971\t4951\t4\n4\twarmup\ttree\t1792034525159\t1792034526161\t431.7432\t2321\t1\n5\twarmup\thash\t1792034526162\t1792034527168\t178.8611\t5620\t4\n6\tmeasure\ttree\t1792034527169\t1792034528174\t408.2912\t2462\t1\n7\tmeasure\thash\t1792034528176\t1792034529181\t185.6606\t5414\t3\n8\tmeasure\tlinked\t1792034529182\t1792034530187\t200.4488\t5015\t2\n9\tmeasure\ttree\t1792034530188\t1792034531194\t420.5841\t2390\t1\n10\tmeasure\tlinked\t1792034531194\t1792034532200\t201.5004\t4989\t1\n11\tmeasure\thash\t1792034532201\t1792034533205\t179.7672\t5584\t2\n", "timeline": "", "gc": "[2026-10-15T13:22:00.895+1000][0.005s] Using G1\n[2026-10-15T13:22:01.148+1000][0.258s] GC(0) Pause Young (Normal) (G1 Evacuation Pause) 52M->5M(1024M) 1.549ms\n[2026-10-15T13:22:01.185+1000][0.295s] GC(1) Pause Young (Normal) (G1 Evacuation Pause) 65M->5M(1024M) 1.083ms\n[2026-10-15T13:22:01.519+1000][0.629s] GC(2) Pause Young (Normal) (G1 Evacuation Pause) 614M->5M(1024M) 1.419ms\n[2026-10-15T13:22:01.840+1000][0.950s] GC(3) Pause Young (Normal) (G1 Evacuation Pause) 614M->5M(1024M) 1.143ms\n[2026-10-15T13:22:02.180+1000][1.290s] GC(4) Pause Young (Normal) (G1 Evacuation Pause) 614M->8M(1024M) 1.380ms\n[2026-10-15T13:22:02.518+1000][1.628s] GC(5) Pause Young (Normal) (G1 Evacuation Pause) 615M->8M(1024M) 1.361ms\n[2026-10-15T13:22:02.867+1000][1.977s] GC(6) Pause Young (Normal) (G1 Evacuation Pause) 614M->8M(1024M) 1.508ms\n[2026-10-15T13:22:03.309+1000][2.419s] GC(7) Pause Young (Normal) (G1 Evacuation Pause) 614M->8M(1024M) 1.479ms\n[2026-10-15T13:22:04.051+1000][3.161s] GC(8) Pause Young (Normal) (G1 Evacuation Pause) 614M->8M(1024M) 1.294ms\n[2026-10-15T13:22:04.470+1000][3.580s] GC(9) Pause Young (Normal) (G1 Evacuation Pause) 614M->8M(1024M) 1.362ms\n[2026-10-15T13:22:04.814+1000][3.924s] GC(10) Pause Young (Normal) (G1 Evacuation Pause) 614M->8M(1024M) 1.297ms\n[2026-10-15T13:22:05.158+1000][4.268s] GC(11) Pause Young (Normal) (G1 Evacuation Pause) 614M->8M(1024M) 1.208ms\n[2026-10-15T13:22:05.981+1000][5.092s] GC(12) Pause Young (Normal) (G1 Evacuation Pause) 614M->8M(1024M) 1.283ms\n[2026-10-15T13:22:06.422+1000][5.532s] GC(13) Pause Young (Normal) (G1 Evacuation Pause) 614M->8M(1024M) 1.244ms\n[2026-10-15T13:22:06.746+1000][5.856s] GC(14) Pause Young (Normal) (G1 Evacuation Pause) 614M->8M(1024M) 1.331ms\n[2026-10-15T13:22:07.067+1000][6.177s] GC(15) Pause Young (Normal) (G1 Evacuation Pause) 614M->8M(1024M) 1.643ms\n[2026-10-15T13:22:07.728+1000][6.838s] GC(16) Pause Young (Normal) (G1 Evacuation Pause) 618M->8M(1024M) 0.931ms\n[2026-10-15T13:22:08.310+1000][7.420s] GC(17) Pause Young (Normal) (G1 Evacuation Pause) 618M->8M(1024M) 0.938ms\n[2026-10-15T13:22:08.640+1000][7.750s] GC(18) Pause Young (Normal) (G1 Evacuation Pause) 618M->8M(1024M) 0.960ms\n[2026-10-15T13:22:08.994+1000][8.104s] GC(19) Pause Young (Normal) (G1 Evacuation Pause) 618M->8M(1024M) 1.113ms\n[2026-10-15T13:22:09.343+1000][8.453s] GC(20) Pause Young (Normal) (G1 Evacuation Pause) 621M->8M(1024M) 0.700ms\n[2026-10-15T13:22:09.695+1000][8.805s] GC(21) Pause Young (Normal) (G1 Evacuation Pause) 621M->8M(1024M) 0.608ms\n[2026-10-15T13:22:10.041+1000][9.151s] GC(22) Pause Young (Normal) (G1 Evacuation Pause) 621M->8M(1024M) 0.691ms\n[2026-10-15T13:22:10.686+1000][9.796s] GC(23) Pause Young (Normal) (G1 Evacuation Pause) 621M->8M(1024M) 0.665ms\n[2026-10-15T13:22:11.314+1000][10.424s] GC(24) Pause Young (Normal) (G1 Evacuation Pause) 621M->8M(1024M) 0.602ms\n[2026-10-15T13:22:11.660+1000][10.770s] GC(25) Pause Young (Normal) (G1 Evacuation Pause) 621M->8M(1024M) 0.642ms\n[2026-10-15T13:22:12.014+1000][11.124s] GC(26) Pause Young (N
