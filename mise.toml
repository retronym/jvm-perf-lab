[tools]
java = "temurin-21"   # builds the Java 17 release; the profilers run in whatever JDK the benchmark forks use
python = "3.12"
uv = "latest"

[tasks.build]
description = "Compile, test and package the Java modules and the sample (examples/sample/target/benchmarks.jar)"
run = "./mvnw -q -B verify"

[tasks.test]
description = "Run the Java and Python unit tests"
run = ["./mvnw -q -B test", "python3 -m unittest discover -s python/tests"]

[tasks.install]
description = "Install a snapshot into ~/.m2, for a benchmark build that reads mavenLocal while iterating"
run = "./mvnw -q -B install -DskipTests"

[tasks.cli]
description = "Install the perflab command (uv tool), from this checkout"
run = "uv tool install --force --editable ./python"

[tasks.site]
description = "Run the sample under every profile this machine supports, its campaigns, and build its site in examples/sample/out/site"
env = { PYTHONPATH = "{{config_root}}/python/src" }
run = "examples/sample/site.sh"

[tasks.publish-site]
description = "Force-push examples/sample/out/site to the gh-pages branch. Run `mise run site` first."
run = """
set -euo pipefail
test -f examples/sample/out/site/index.html || { echo "no site: run 'mise run site' first"; exit 1; }
tmp=$(mktemp -d)
cp -R examples/sample/out/site/. "$tmp/"
git -C "$tmp" init -q -b gh-pages
git -C "$tmp" add -A
git -C "$tmp" -c user.name="$(git config user.name)" -c user.email="$(git config user.email)" commit -q -m "Sample results"
git -C "$tmp" push -q -f "$(git remote get-url origin)" gh-pages
rm -rf "$tmp"
echo "pushed gh-pages"
"""

[tasks."tools:async-profiler"]
description = "Check out and build retronym/async-profiler's integration branch (kperf events, jfrconv --hw) into tools/build/async-profiler"
run = """
set -euo pipefail
dir=tools/build/async-profiler
repo="${ASYNC_PROFILER_REPO:-https://github.com/retronym/async-profiler.git}"   # or a local checkout
ref="${ASYNC_PROFILER_REF:-integration-kperf-flamegraph}"
if [ ! -d "$dir/.git" ]; then git clone -q "$repo" "$dir"; fi
git -C "$dir" remote set-url origin "$repo"
git -C "$dir" fetch -q origin "$ref"
git -C "$dir" checkout -q --detach FETCH_HEAD
make -C "$dir" -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc)" >/dev/null
git -C "$dir" rev-parse HEAD > "$dir/BUILT_COMMIT"
echo "async-profiler $(cut -c1-10 "$dir/BUILT_COMMIT") ($ref): $dir/build/lib, $dir/build/bin"
"""

# The perflab server as a launchd agent (macOS): started at login, restarted if it dies, run from this checkout's
# python/src with this mise's Python and the PATH of the shell that installed it (jobs bring their submitter's own).
# `perflab server stop` exits cleanly and launchd leaves it stopped; `mise run server:restart` brings it back. Jobs run
# on through a restart (own session, AbandonProcessGroup) and the new server adopts them.
[tasks."server:install"]
description = "Install and start the perflab server as a launchd agent (~/Library/LaunchAgents), stopping any server started otherwise"
run = """
set -euo pipefail
label=io.github.retronym.perflab.server
plist="$HOME/Library/LaunchAgents/$label.plist"
home="${PERFLAB_SERVER_HOME:-$HOME/.perflab/server}"
python=$(command -v python3)
mkdir -p "$home" "$(dirname "$plist")"
launchctl bootout "gui/$(id -u)/$label" 2>/dev/null || true
PYTHONPATH="{{config_root}}/python/src" "$python" -m perflab server stop || true
cat > "$plist" <<PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
  <key>Label</key><string>$label</string>
  <key>ProgramArguments</key><array>
    <string>$python</string><string>-m</string><string>perflab</string><string>server</string><string>run</string>
  </array>
  <key>EnvironmentVariables</key><dict>
    <key>PYTHONPATH</key><string>{{config_root}}/python/src</string>
    <key>PATH</key><string>$PATH</string>
    <key>PERFLAB_SERVER_HOME</key><string>$home</string>
  </dict>
  <key>WorkingDirectory</key><string>$home</string>
  <key>StandardOutPath</key><string>$home/server.log</string>
  <key>StandardErrorPath</key><string>$home/server.log</string>
  <key>RunAtLoad</key><true/>
  <key>KeepAlive</key><dict><key>SuccessfulExit</key><false/></dict>
  <key>ThrottleInterval</key><integer>30</integer>
  <key>AbandonProcessGroup</key><true/>
  <key>ProcessType</key><string>Interactive</string>
</dict></plist>
PLIST
plutil -lint -s "$plist"
launchctl bootstrap "gui/$(id -u)" "$plist"
for _ in $(seq 50); do test -f "$home/server.json" && break; sleep 0.2; done
PYTHONPATH="{{config_root}}/python/src" "$python" -m perflab server status
"""

[tasks."server:restart"]
description = "Restart the launchd perflab server (on this code); running jobs carry on and are adopted"
run = """
set -euo pipefail
launchctl kickstart -k "gui/$(id -u)/io.github.retronym.perflab.server"
home="${PERFLAB_SERVER_HOME:-$HOME/.perflab/server}"
sleep 1; for _ in $(seq 50); do test -f "$home/server.json" && break; sleep 0.2; done
PYTHONPATH="{{config_root}}/python/src" python3 -m perflab server status
"""

[tasks."server:uninstall"]
description = "Stop the launchd perflab server and remove its agent; jobs, results and ~/.perflab/server stay"
run = """
set -euo pipefail
label=io.github.retronym.perflab.server
launchctl bootout "gui/$(id -u)/$label" 2>/dev/null || echo "not loaded"
rm -f "$HOME/Library/LaunchAgents/$label.plist"
echo "removed $label"
"""
