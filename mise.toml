[tools]
java = "temurin-21"   # builds the Java 17 release; the profilers run in whatever JDK the benchmark forks use
python = "3.12"
uv = "latest"

[tasks.build]
description = "Compile, test and package the Java modules and the sample (examples/sample/target/benchmarks.jar)"
run = "./mvnw -q -B verify"

[tasks.test]
description = "Run the Java and Python unit tests"
run = ["./mvnw -q -B test", "python3 -m unittest discover -s python/tests"]

[tasks.install]
description = "Install a snapshot into ~/.m2, for a benchmark build that reads mavenLocal while iterating"
run = "./mvnw -q -B install -DskipTests"

[tasks.cli]
description = "Install the perflab command (uv tool), from this checkout"
run = "uv tool install --force --editable ./python"

[tasks.site]
description = "Run the sample under every profile this machine supports, its campaigns, and build its site in examples/sample/out/site"
env = { PYTHONPATH = "{{config_root}}/python/src" }
run = "examples/sample/site.sh"

[tasks.publish-site]
description = "Force-push examples/sample/out/site to the gh-pages branch. Run `mise run site` first."
run = """
set -euo pipefail
test -f examples/sample/out/site/index.html || { echo "no site: run 'mise run site' first"; exit 1; }
tmp=$(mktemp -d)
cp -R examples/sample/out/site/. "$tmp/"
git -C "$tmp" init -q -b gh-pages
git -C "$tmp" add -A
git -C "$tmp" -c user.name="$(git config user.name)" -c user.email="$(git config user.email)" commit -q -m "Sample results"
git -C "$tmp" push -q -f "$(git remote get-url origin)" gh-pages
rm -rf "$tmp"
echo "pushed gh-pages"
"""

[tasks."tools:async-profiler"]
description = "Check out and build retronym/async-profiler's integration branch (kperf events, jfrconv --hw) into tools/build/async-profiler"
run = """
set -euo pipefail
dir=tools/build/async-profiler
repo="${ASYNC_PROFILER_REPO:-https://github.com/retronym/async-profiler.git}"   # or a local checkout
ref="${ASYNC_PROFILER_REF:-integration-kperf-flamegraph}"
if [ ! -d "$dir/.git" ]; then git clone -q "$repo" "$dir"; fi
git -C "$dir" remote set-url origin "$repo"
git -C "$dir" fetch -q origin "$ref"
git -C "$dir" checkout -q --detach FETCH_HEAD
make -C "$dir" -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc)" >/dev/null
git -C "$dir" rev-parse HEAD > "$dir/BUILT_COMMIT"
echo "async-profiler $(cut -c1-10 "$dir/BUILT_COMMIT") ($ref): $dir/build/lib, $dir/build/bin"
"""
