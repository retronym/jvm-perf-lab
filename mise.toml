[tools]
java = "temurin-21"   # builds the Java 17 release; the profilers run in whatever JDK the benchmark forks use
python = "3.12"
uv = "latest"

[tasks.build]
description = "Compile, test and package the Java modules and the sample (examples/sample/target/benchmarks.jar)"
run = "./mvnw -q -B verify"

[tasks.test]
description = "Run the Java and Python unit tests"
run = ["./mvnw -q -B test", "python3 -m unittest discover -s python/tests"]

[tasks.install]
description = "Install a snapshot into ~/.m2, for a benchmark build that reads mavenLocal while iterating"
run = "./mvnw -q -B install -DskipTests"

[tasks.cli]
description = "Install the perflab command (uv tool), from this checkout"
run = "uv tool install --force --editable ./python"

[tasks.site]
description = "Run the sample under every profile this machine supports, its campaigns, and build its site in examples/sample/out/site"
env = { PYTHONPATH = "{{config_root}}/python/src" }
run = "examples/sample/site.sh"

[tasks.publish-site]
description = "Force-push examples/sample/out/site to the gh-pages branch. Run `mise run site` first."
run = """
set -euo pipefail
test -f examples/sample/out/site/index.html || { echo "no site: run 'mise run site' first"; exit 1; }
tmp=$(mktemp -d)
cp -R examples/sample/out/site/. "$tmp/"
git -C "$tmp" init -q -b gh-pages
git -C "$tmp" add -A
git -C "$tmp" -c user.name="$(git config user.name)" -c user.email="$(git config user.email)" commit -q -m "Sample results"
git -C "$tmp" push -q -f "$(git remote get-url origin)" gh-pages
rm -rf "$tmp"
echo "pushed gh-pages"
"""

[tasks."tools:async-profiler"]
description = "Check out and build retronym/async-profiler's integration branch (kperf events, jfrconv --hw) into tools/build/async-profiler"
run = """
set -euo pipefail
dir=tools/build/async-profiler
repo="${ASYNC_PROFILER_REPO:-https://github.com/retronym/async-profiler.git}"   # or a local checkout
ref="${ASYNC_PROFILER_REF:-integration-kperf-flamegraph}"
if [ ! -d "$dir/.git" ]; then git clone -q "$repo" "$dir"; fi
git -C "$dir" remote set-url origin "$repo"
git -C "$dir" fetch -q origin "$ref"
git -C "$dir" checkout -q --detach FETCH_HEAD
make -C "$dir" -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc)" >/dev/null
git -C "$dir" rev-parse HEAD > "$dir/BUILT_COMMIT"
echo "async-profiler $(cut -c1-10 "$dir/BUILT_COMMIT") ($ref): $dir/build/lib, $dir/build/bin"
"""

[tasks."tools:hsdis"]
description = "Build hsdis (HotSpot's disassembler plugin, on capstone) and install it into the JDKs of HSDIS_JDKS (default: $JAVA_HOME), for `perflab asm`"
run = """
set -euo pipefail
jdks="${HSDIS_JDKS:-${JAVA_HOME:-}}"   # JDK homes, space-separated
test -n "$jdks" || { echo "HSDIS_JDKS (or JAVA_HOME): the JDK homes to install hsdis into"; exit 1; }
tag="${HSDIS_TAG:-jdk-26+35}"            # OpenJDK's hsdis sources: two files, from this tag (or HSDIS_SRC, a JDK checkout)
cs="$(brew --prefix capstone 2>/dev/null || true)"
test -f "$cs/lib/libcapstone.a" || { echo "no static capstone: brew install capstone"; exit 1; }
case "$(uname -m)" in
  arm64|aarch64) arch=aarch64; mode=CS_MODE_ARM; csarch=$(grep -q CS_ARCH_AARCH64 "$cs/include/capstone/capstone.h" && echo CS_ARCH_AARCH64 || echo CS_ARCH_ARM64) ;;
  x86_64) arch=amd64; mode=CS_MODE_64; csarch=CS_ARCH_X86 ;;
  *) echo "unsupported $(uname -m)"; exit 1 ;;
esac
case "$(uname -s)" in Darwin) ext=dylib; os=darwin ;; *) ext=so; os=linux ;; esac
out=tools/build/hsdis
mkdir -p "$out/src"
if [ -n "${HSDIS_SRC:-}" ]; then
  cp "$HSDIS_SRC/src/utils/hsdis/capstone/hsdis-capstone.c" "$HSDIS_SRC/src/utils/hsdis/hsdis.h" "$out/src/"
else
  for f in capstone/hsdis-capstone.c hsdis.h; do
    curl -fsSL "https://raw.githubusercontent.com/openjdk/jdk/$tag/src/utils/hsdis/$f" -o "$out/src/$(basename $f)"
  done
fi
lib="$out/hsdis-$arch.$ext"
first=${jdks%% *}
# capstone linked statically: the library is self-contained; jni.h from the first JDK
cc -O2 -shared -fPIC -DCAPSTONE_ARCH=$csarch -DCAPSTONE_MODE=$mode -I"$first/include" -I"$first/include/$os" -I"$out/src" \
   -I"$cs/include/capstone" -I"$cs/include" "$out/src/hsdis-capstone.c" "$cs/lib/libcapstone.a" -o "$lib"
for j in $jdks; do
  if cp "$lib" "$j/lib/" 2>/dev/null; then echo "installed $j/lib/$(basename $lib)"; else echo "could not write $j/lib: sudo cp $lib $j/lib/"; fi
done
"""

# The perflab server as a launchd agent (macOS): started at login, restarted if it dies, run from this checkout's
# python/src with this mise's Python and the PATH of the shell that installed it (jobs bring their submitter's own).
# `perflab server stop` exits cleanly and launchd leaves it stopped; `mise run server:restart` brings it back. Jobs run
# on through a restart (own session, AbandonProcessGroup) and the new server adopts them.
[tasks."server:install"]
description = "Install and start the perflab server as a launchd agent (~/Library/LaunchAgents), stopping any server started otherwise"
run = """
set -euo pipefail
label=io.github.retronym.perflab.server
plist="$HOME/Library/LaunchAgents/$label.plist"
home="${PERFLAB_SERVER_HOME:-$HOME/.perflab/server}"
python=$(command -v python3)
mkdir -p "$home" "$(dirname "$plist")"
launchctl bootout "gui/$(id -u)/$label" 2>/dev/null || true
PYTHONPATH="{{config_root}}/python/src" "$python" -m perflab server stop || true
cat > "$plist" <<PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
  <key>Label</key><string>$label</string>
  <key>ProgramArguments</key><array>
    <string>$python</string><string>-m</string><string>perflab</string><string>server</string><string>run</string>
  </array>
  <key>EnvironmentVariables</key><dict>
    <key>PYTHONPATH</key><string>{{config_root}}/python/src</string>
    <key>PATH</key><string>$PATH</string>
    <key>PERFLAB_SERVER_HOME</key><string>$home</string>
  </dict>
  <key>WorkingDirectory</key><string>$home</string>
  <key>StandardOutPath</key><string>$home/server.log</string>
  <key>StandardErrorPath</key><string>$home/server.log</string>
  <key>RunAtLoad</key><true/>
  <key>KeepAlive</key><dict><key>SuccessfulExit</key><false/></dict>
  <key>ThrottleInterval</key><integer>30</integer>
  <key>AbandonProcessGroup</key><true/>
  <key>ProcessType</key><string>Interactive</string>
</dict></plist>
PLIST
plutil -lint -s "$plist"
launchctl bootstrap "gui/$(id -u)" "$plist"
for _ in $(seq 50); do test -f "$home/server.json" && break; sleep 0.2; done
PYTHONPATH="{{config_root}}/python/src" "$python" -m perflab server status
"""

[tasks."kperf:install"]
description = "Run the asprof-kperf helper (built by tools:async-profiler) as a launchd daemon at /tmp/asprof-kperf.sock, for this user: started at boot, restarted if it dies (sudo)"
run = """
set -euo pipefail
label=io.github.retronym.asprof-kperf
built="{{config_root}}/tools/build/async-profiler/build/bin/asprof-kperf"
bin=/usr/local/libexec/asprof-kperf   # root's own copy: root never runs a binary this user can rewrite
plist="/Library/LaunchDaemons/$label.plist"
sock="${KPERF_SOCKET:-/tmp/asprof-kperf.sock}"
test -x "$built" || { echo "no $built: mise run tools:async-profiler first"; exit 1; }
tmp=$(mktemp)
cat > "$tmp" <<PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
  <key>Label</key><string>$label</string>
  <key>ProgramArguments</key><array>
    <string>$bin</string><string>-s</string><string>$sock</string><string>-u</string><string>$(id -u)</string><string>-d</string>
  </array>
  <key>RunAtLoad</key><true/>
  <key>KeepAlive</key><true/>
  <key>StandardOutPath</key><string>/tmp/asprof-kperf.log</string>
  <key>StandardErrorPath</key><string>/tmp/asprof-kperf.log</string>
</dict></plist>
PLIST
plutil -lint -s "$tmp"
sudo launchctl bootout "system/$label" 2>/dev/null || true
sudo install -d -o root -g wheel /usr/local/libexec
sudo install -o root -g wheel -m 755 "$built" "$bin"
sudo install -o root -g wheel -m 644 "$tmp" "$plist"
rm -f "$tmp"
sudo launchctl bootstrap system "$plist"
for _ in $(seq 50); do test -S "$sock" && break; sleep 0.2; done
ls -l "$sock" && tail -1 /tmp/asprof-kperf.log
"""

[tasks."kperf:uninstall"]
description = "Stop and remove the asprof-kperf launchd daemon (sudo)"
run = """
sudo launchctl bootout system/io.github.retronym.asprof-kperf 2>/dev/null || true
sudo rm -f /Library/LaunchDaemons/io.github.retronym.asprof-kperf.plist /usr/local/libexec/asprof-kperf
"""

[tasks."tunnel:install"]
description = "On the coordinator: keep an ssh tunnel to a perflab worker up as a launchd agent (TUNNEL_HOST: an ~/.ssh/config host with its RemoteForward; default perflab-tunnel)"
run = """
set -euo pipefail
host="${TUNNEL_HOST:-perflab-tunnel}"
label="io.github.retronym.perflab.tunnel.$host"
plist="$HOME/Library/LaunchAgents/$label.plist"
ssh -G "$host" | grep -qi '^remoteforward ' || { echo "~/.ssh/config: $host has no RemoteForward"; exit 1; }
mkdir -p "$(dirname "$plist")" "$HOME/.perflab"
launchctl bootout "gui/$(id -u)/$label" 2>/dev/null || true
cat > "$plist" <<PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
  <key>Label</key><string>$label</string>
  <key>ProgramArguments</key><array>
    <string>/usr/bin/ssh</string><string>-N</string><string>-o</string><string>BatchMode=yes</string>
    <string>-o</string><string>ExitOnForwardFailure=yes</string><string>-o</string><string>ServerAliveInterval=30</string>
    <string>-o</string><string>ServerAliveCountMax=3</string><string>$host</string>
  </array>
  <key>RunAtLoad</key><true/>
  <key>KeepAlive</key><true/>
  <key>ThrottleInterval</key><integer>30</integer>
  <key>StandardOutPath</key><string>$HOME/.perflab/tunnel-$host.log</string>
  <key>StandardErrorPath</key><string>$HOME/.perflab/tunnel-$host.log</string>
</dict></plist>
PLIST
plutil -lint -s "$plist"
launchctl bootstrap "gui/$(id -u)" "$plist"
echo "tunnel $host: launchd agent $label (log ~/.perflab/tunnel-$host.log)"
"""

[tasks."worker:install"]
description = "On a worker: run perflab worker (from this checkout) as a launchd agent in the login shell's environment, kept awake (settings: ~/.perflab/worker/worker.toml)"
run = """
set -euo pipefail
label=io.github.retronym.perflab.worker
plist="$HOME/Library/LaunchAgents/$label.plist"
home="${PERFLAB_WORKER_HOME:-$HOME/.perflab/worker}"
lib="${ASYNC_PROFILER_LIB:-}"
mkdir -p "$home" "$(dirname "$plist")"
launchctl bootout "gui/$(id -u)/$label" 2>/dev/null || true
pkill -f "perflab worker" 2>/dev/null || true
cat > "$plist" <<PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
  <key>Label</key><string>$label</string>
  <key>ProgramArguments</key><array>
    <string>$SHELL</string><string>-lic</string><string>exec caffeinate -i python3 -m perflab worker</string>
  </array>
  <key>EnvironmentVariables</key><dict>
    <key>PYTHONPATH</key><string>{{config_root}}/python/src</string>
    <key>PERFLAB_WORKER_HOME</key><string>$home</string>
    $( [ -n "$lib" ] && echo "<key>ASYNC_PROFILER_LIB</key><string>$lib</string>" )
  </dict>
  <key>WorkingDirectory</key><string>$home</string>
  <key>RunAtLoad</key><true/>
  <key>KeepAlive</key><true/>
  <key>ThrottleInterval</key><integer>30</integer>
  <key>ProcessType</key><string>Interactive</string>
  <key>StandardOutPath</key><string>$home/worker.log</string>
  <key>StandardErrorPath</key><string>$home/worker.log</string>
</dict></plist>
PLIST
plutil -lint -s "$plist"
launchctl bootstrap "gui/$(id -u)" "$plist"
sleep 3; tail -1 "$home/worker.log"
"""

[tasks."server:restart"]
description = "Restart the launchd perflab server (on this code); running jobs carry on and are adopted. A code change reloads it anyway"
run = """
set -euo pipefail
launchctl kickstart -k "gui/$(id -u)/io.github.retronym.perflab.server"
home="${PERFLAB_SERVER_HOME:-$HOME/.perflab/server}"
sleep 1; for _ in $(seq 50); do test -f "$home/server.json" && break; sleep 0.2; done
PYTHONPATH="{{config_root}}/python/src" python3 -m perflab server status
"""

[tasks."server:uninstall"]
description = "Stop the launchd perflab server and remove its agent; jobs, results and ~/.perflab/server stay"
run = """
set -euo pipefail
label=io.github.retronym.perflab.server
launchctl bootout "gui/$(id -u)/$label" 2>/dev/null || echo "not loaded"
rm -f "$HOME/Library/LaunchAgents/$label.plist"
echo "removed $label"
"""
